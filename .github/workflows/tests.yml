name: Numerical checks
on: [push, pull_request]
jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Installed tool outside checkout
        run: |
          cd /tmp
          options-risk "$GITHUB_WORKSPACE/examples/portfolio.json" --output installed-check.json
          python -m options_risk.quotes "$GITHUB_WORKSPACE/examples/quotes.json" --output installed-quote-review
          python -m options_risk.quotes installed-quote-review/result.json --output installed-quote-replayed
          python -m options_risk.grid "$GITHUB_WORKSPACE/examples/price-grid.json" --output installed-price-grid
          python -m options_risk.grid installed-price-grid/request.json --output installed-price-grid-replayed
          cmp installed-price-grid/results.json installed-price-grid-replayed/results.json
          python -m options_risk.diagnostics "$GITHUB_WORKSPACE/examples/greek-boundary.json" --output installed-numerical-diagnostics

  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check web/app.js && node --check web/quotes-app.js && node --check web/worker.mjs
      - run: python scripts/build_web.py
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-flow.cjs
      - run: node tests/browser-grid.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: |
            outputs/browser-flow/
            outputs/browser-grid/

  independent-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[validation]'
      - run: python -m unittest discover -s tests -v
      - run: python -m options_risk.validation examples/portfolio.json --output /tmp/reference-standard
      - run: python -m options_risk.validation examples/counterexample.json --output /tmp/reference-counterexample
      - name: Installed independent validator outside checkout
        run: |
          cd /tmp
          python -m options_risk.validation "$GITHUB_WORKSPACE/examples/greek-boundary.json" --output /tmp/reference-greek-boundary
      - uses: actions/upload-artifact@v4
        with:
          name: independent-reference-evidence
          path: /tmp/reference-*/
